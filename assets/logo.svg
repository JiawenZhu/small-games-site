<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quad Squirrel">
  <title>Quad Squirrel</title>
  <!-- The Quad: four quadrants of a lawn crossed by two paths, and a 2x2 puzzle
       board. One cell per thing a squirrel's quad holds — leaf, acorn, paw, tail. -->
  <rect x="3.7"  y="3.7"  width="26" height="26" rx="7" fill="#6E7D3F"/>
  <rect x="34.3" y="3.7"  width="26" height="26" rx="7" fill="#BE4E18"/>
  <rect x="3.7"  y="34.3" width="26" height="26" rx="7" fill="#284A6B"/>
  <rect x="34.3" y="34.3" width="26" height="26" rx="7" fill="#D9922B"/>

  <g fill="#F7EFE9">
    <!-- leaf -->
    <g transform="translate(7.4,7.4) scale(0.80)">
      <path d="M21.4 2.6C21.4 12.6 15.2 19.4 5.4 20.3Z"/>
      <path d="M20.2 3.8C10.4 4.7 4.2 11.5 4.2 21.5Z"/>
      <path d="M5.2 20.5 2.2 23.4" fill="none" stroke="#F7EFE9" stroke-width="1.9" stroke-linecap="round"/>
    </g>
    <!-- acorn -->
    <g transform="translate(38.0,7.4) scale(0.80)">
      <rect x="10.7" y="0.6" width="2.6" height="3.8" rx="1.3"/>
      <path d="M2.6 7.2C2.6 3.6 6.8 1.6 12 1.6s9.4 2 9.4 5.6Z"/>
      <path d="M3.4 8.9h17.2c0 6.5-3.6 13.2-8.6 14.9C7 22.1 3.4 15.4 3.4 8.9Z"/>
    </g>
    <!-- paw -->
    <g transform="translate(7.4,38.0) scale(0.80)">
      <circle cx="6.3" cy="10.4" r="2.35"/><circle cx="10.4" cy="7.2" r="2.35"/>
      <circle cx="14.6" cy="7.2" r="2.35"/><circle cx="18.7" cy="10.4" r="2.35"/>
      <path d="M12.5 22.6c-4.8 0-6.8-3.6-5.2-6.4 1.6-2.9 8.8-2.9 10.4 0 1.6 2.8-.4 6.4-5.2 6.4Z"/>
    </g>
    <!-- tail -->
    <g transform="translate(38.0,38.0) scale(0.80)" fill="none" stroke="#F7EFE9" stroke-linecap="round">
      <path d="M6.4 21.8C14 21.8 19.4 17.6 20.4 12" stroke-width="5.4"/>
      <path d="M20.4 12C21.4 6.6 17.2 2.8 12.6 3.8 9.2 4.5 7.6 8 9.8 10.4" stroke-width="4"/>
    </g>
  </g>
</svg>
